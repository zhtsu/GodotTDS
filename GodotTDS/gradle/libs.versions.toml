[versions]
agp = "8.5.2"
kotlin = "2.1.20"
coreKtx = "1.13.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.13.0"
godot = "4.5.1.stable"
lc-storage-android = "8.2.24"
lc-realtime-android = "8.2.24"
okhttp = "4.9.2"
rxandroid = "2.1.1"
rxjava = "2.2.19"
appcompat-v7 = "28.0.0"
support-annotations = "28.0.0"
support-v4 = "28.0.0"
glide = "4.16.0"
recyclerview-v7 = "28.0.0"
taptap = "4.9.2"
kotlinxSerialization = "1.4.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
godot = { group = "org.godotengine", name = "godot", version.ref = "godot" }
lc-storage-android = { group = "com.taptap", name = "lc-storage-android", version.ref = "lc-storage-android" }
lc-realtime-android = { group = "com.taptap", name = "lc-realtime-android", version.ref = "lc-realtime-android" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
appcompat-v7 = { group = "com.android.support", name = "appcompat-v7", version.ref = "appcompat-v7" }
support-annotations = { group = "com.android.support", name = "support-annotations", version.ref = "support-annotations" }
support-v4 = { group = "com.android.support", name = "support-v4", version.ref = "support-v4" }
glide = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glide" }
recyclerview-v7 = { group = "com.android.support", name = "recyclerview-v7", version.ref = "recyclerview-v7" }

tap-core = { group = "com.taptap.sdk", name = "tap-core", version.ref = "taptap" }
tap-login = { group = "com.taptap.sdk", name = "tap-login", version.ref = "taptap" }
tap-compliance = { group = "com.taptap.sdk", name = "tap-compliance", version.ref = "taptap" }
tap-moment = { group = "com.taptap.sdk", name = "tap-moment", version.ref = "taptap" }
tap-achievement = { group = "com.taptap.sdk", name = "tap-achievement", version.ref = "taptap" }
tap-leaderboard-androidx = { group = "com.taptap.sdk", name = "tap-leaderboard-androidx", version.ref = "taptap" }
tap-cloudsave = { group = "com.taptap.sdk", name = "tap-cloudsave", version.ref = "taptap" }

kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
